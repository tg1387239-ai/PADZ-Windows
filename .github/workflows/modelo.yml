name: Copiar el motor de IA de Secuencias

# Baja los modelos HT-Demucs de 4 y de 6 pistas (licencia MIT) de Hugging Face y lo guarda en la rama "modelo" partido en pedazos de 24 MB,
# para que PADZ lo sirva desde su propio sitio (más rápido y sin depender de otros servidores).
on:
  push:
    branches: [main]
    paths: [".github/workflows/modelo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modelo:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el modelo
        run: |
          curl -L --fail --retry 3 -o htdemucs.onnx "https://huggingface.co/timcsy/demucs-web-onnx/resolve/main/htdemucs_embedded.onnx"
          ls -la htdemucs.onnx
          test $(stat -c%s htdemucs.onnx) -gt 100000000
          curl -L --fail --retry 3 -o htdemucs6.onnx "https://huggingface.co/adowu/htdemucs-6s-onnx/resolve/main/htdemucs_6s_fp16weights.onnx"
          ls -la htdemucs6.onnx
          test $(stat -c%s htdemucs6.onnx) -gt 100000000
      - name: Bajar la guía del modelo de 6 pistas
        run: curl -L --fail --retry 3 -o infer6.py "https://huggingface.co/adowu/htdemucs-6s-onnx/resolve/main/infer.py"
      - name: Partir y guardar en la rama modelo
        run: |
          mkdir -p out/modelo && split -b 24m -d -a 2 htdemucs.onnx out/modelo/htdemucs.part
          SIZE=$(stat -c%s htdemucs.onnx); SHA=$(sha256sum htdemucs.onnx | cut -d' ' -f1)
          PARTS=$(cd out/modelo && ls htdemucs.part* | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))")
          echo "{\"file\":\"htdemucs_embedded.onnx\",\"source\":\"https://huggingface.co/timcsy/demucs-web-onnx\",\"license\":\"MIT\",\"size\":$SIZE,\"sha256\":\"$SHA\",\"parts\":$PARTS}" > out/modelo/info.json
          cp infer6.py out/modelo/infer6.py
          mkdir -p out/modelo6 && split -b 24m -d -a 2 htdemucs6.onnx out/modelo6/htdemucs6.part
          SIZE6=$(stat -c%s htdemucs6.onnx); SHA6=$(sha256sum htdemucs6.onnx | cut -d' ' -f1)
          PARTS6=$(cd out/modelo6 && ls htdemucs6.part* | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin]))")
          echo "{\"file\":\"htdemucs_6s_fp16weights.onnx\",\"source\":\"https://huggingface.co/adowu/htdemucs-6s-onnx\",\"license\":\"MIT\",\"size\":$SIZE6,\"sha256\":\"$SHA6\",\"stems\":[\"drums\",\"bass\",\"other\",\"vocals\",\"guitar\",\"piano\"],\"parts\":$PARTS6}" > out/modelo6/info.json
          cat out/modelo6/info.json
          cd out && git init -q -b modelo && git add -A
          git -c user.name="PADZ" -c user.email="actions@users.noreply.github.com" commit -q -m "Motor de IA de Secuencias (HT-Demucs, MIT)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" modelo
