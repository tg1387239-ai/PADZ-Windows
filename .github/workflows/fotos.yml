name: Bajar fotos para los diseños

# Fotos libres de Unsplash (Licencia Unsplash: uso gratis, también comercial, sin pedir permiso) para las propuestas de diseño de PADZ.
on:
  push:
    branches: [main]
    paths: [".github/workflows/fotos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar
        run: |
          mkdir -p out/fotos && cd out/fotos
          get() { curl -sSL --fail --retry 3 -o "$1.jpg" "https://images.unsplash.com/$2?fm=jpg&q=78&w=1400&fit=crop" || echo "falló $1"; }
          get teclados photo-1583162061967-eacb13d913a2
          get banda photo-1554071341-fa46e1372afc
          get guitarra photo-1610414302178-4ba638c4dd4b
          get cantante photo-1558541966-d0c02d9ca1e1
          get publico photo-1521547418549-6a31aad7c177
          ls -la
          printf "Fotos de Unsplash (https://unsplash.com/license)\nteclados: Kelly Sikkema\nbanda: Hermes Rivera\nguitarra: Memento Media\ncantante: Kristina Paparo\npublico: Elizeu Dias\n" > LEEME.txt
          cd .. && git init -q -b fotos && git add -A
          git -c user.name="PADZ" -c user.email="actions@users.noreply.github.com" commit -q -m "Fotos para los diseños (Unsplash)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fotos
