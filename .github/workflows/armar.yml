name: Armar PADZ para Windows

# Se fija cada media hora si hay una versión nueva de PADZ en la web; si la hay, arma el instalador y lo publica.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      repetir_android:
        description: 'Volver a armar y probar el APK aunque ya esté publicado para esta versión'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: armar
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.padz.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar la última versión de PADZ
        id: padz
        shell: bash
        run: node scripts/preparar.mjs
      - name: ¿Ya está publicada?
        id: ya
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.padz.outputs.version }}" >/dev/null 2>&1; then echo "si=1" >> "$GITHUB_OUTPUT"; echo "La versión ya estaba publicada."; fi
      - name: Armar el instalador
        if: steps.ya.outputs.si != '1'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@24.13.3 --win --x64 --projectDir app --publish never
      - name: Publicar
        if: steps.ya.outputs.si != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.padz.outputs.version }}"
          ls -la app/dist
          gh release create "v$V" app/dist/PADZ-Setup.exe --title "PADZ $V" --latest --notes "PADZ $V para Windows (64 bits).

          **Instalar:** bajá **PADZ-Setup.exe** y abrilo. Se instala solo y queda el acceso directo en el escritorio.
          Si Windows muestra *\"Windows protegió tu PC\"*: tocá **Más información → Ejecutar de todas formas** (pasa porque la app todavía no tiene firma paga).
          **Actualizar:** instalá la nueva encima. Tus canciones, set lists y ajustes se mantienen."

  # ---- Android: APK (Capacitor) que abre PADZ web adentro, probado en un emulador antes de publicarlo ----
  android:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ¿Ya está el APK de esta versión?
        id: ya
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.windows.outputs.version }}"; echo "v=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.repetir_android }}" = "true" ]; then echo "Se vuelve a armar y probar el APK (pedido a mano)."; exit 0; fi
          if gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null | grep -qx android-prueba.txt; then echo "si=1" >> "$GITHUB_OUTPUT"; echo "El APK ya estaba publicado."; fi
      # la misma firma de prueba en cada versión (para poder instalar encima sin desinstalar); no se guarda en el repositorio
      - name: Firma (guardada en la caché de GitHub)
        if: steps.ya.outputs.si != '1'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: padz-android-firma-v1
      - name: Armar el APK
        if: steps.ya.outputs.si != '1'
        working-directory: android
        env:
          PADZ_VERSION: ${{ steps.ya.outputs.v }}
        run: |
          mkdir -p capturas
          set -o pipefail
          ( set -e
            npm install --no-audit --no-fund
            npx cap add android
            node scripts/preparar-android.mjs
            npx cap sync android
            cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../PADZ.apk
            ls -la ../PADZ.apk ) 2>&1 | tee capturas/armado.log
      - name: Habilitar KVM (emulador)
        if: steps.ya.outputs.si != '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar en un emulador de Android
        id: emu
        if: steps.ya.outputs.si != '1'
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          disable-animations: true
          working-directory: android
          script: |
            adb install -r PADZ.apk
            npm install --no-save --no-audit --no-fund playwright@1.48.2
            mkdir -p capturas; (timeout 700 adb logcat -v time > capturas/logcat-vivo.txt 2>&1 &); timeout 600 node scripts/prueba.mjs > capturas/prueba.log 2>&1; r=$?; cat capturas/prueba.log; timeout 30 adb logcat -d -v time > capturas/logcat.txt 2>&1; timeout 20 adb exec-out screencap -p > capturas/final.png; exit $r
      - name: Guardar capturas y resultado
        if: always() && steps.ya.outputs.si != '1'
        uses: actions/upload-artifact@v4
        with:
          name: android-prueba
          path: android/capturas
      - name: Capturas a la rama android-prueba (para revisarlas)
        if: always() && steps.ya.outputs.si != '1'
        run: |
          [ -d android/capturas ] || exit 0
          git init -q o && cp -r android/capturas/. o/ && cd o && git checkout -q -b android-prueba && git add -A && git -c user.name=padz -c user.email=padz@padz -c commit.gpgsign=false commit -qm "prueba android ${{ steps.ya.outputs.v }}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-prueba
      - name: Publicar el APK
        if: steps.ya.outputs.si != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ya.outputs.v }}"
          # APK EXPERIMENTAL: armado y (si el emulador anduvo) abierto en un emulador. NO está validado en un teléfono real.
          # "PADZ.apk" queda reservado para una versión validada en teléfono (se marca a mano, no lo decide este flujo).
          cp android/capturas/resultado.txt android-prueba.txt 2>/dev/null || echo "prueba en emulador incompleta" > android-prueba.txt
          EMU="${{ steps.emu.outcome }}"; echo "emulador: $EMU" >> android-prueba.txt
          cp android/PADZ.apk android/PADZ-experimental.apk
          gh release upload "v$V" android/PADZ-experimental.apk android-prueba.txt --clobber
          gh release view "v$V" --json body -q .body > notas.md
          if [ "$EMU" = "success" ]; then E="abrió bien en un emulador"; else E="la prueba en el emulador no terminó (el emulador de GitHub se cae seguido)"; fi
          printf '\n\n**Android (experimental):** **PADZ-experimental.apk**: %s, pero todavía **no está probada en un teléfono real**. Firma de prueba, no está en Play Store. Si pide permiso para "instalar apps desconocidas", aceptalo para el navegador o Archivos.\n' "$E" >> notas.md
          gh release edit "v$V" --notes-file notas.md
